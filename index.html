<style>
/* Layout: one calm column for a phone — Bangla first, very large type and tap targets, one task per screen. */
:root{
  --paper:#F4F6FA; --card:#FFFFFF; --ink:#14213D; --muted:#525C75; --line:#D5DBE7;
  --btn:#1D3A6B; --btn-fg:#FFFFFF; --accent:#A8323A; --soft:#E6EBF5;
  --good:#17703F; --good-bg:#E1F2E6; --bad:#A92A22; --bad-bg:#FBE6E3;
  --f-head:"Public Sans","Hind Siliguri",system-ui,sans-serif; --f-body:"Atkinson Hyperlegible","Hind Siliguri",system-ui,sans-serif; --f-bn:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1422; --card:#172034; --ink:#E9EDF5; --muted:#A3AEC3; --line:#2B3650;
  --btn:#8FB2F2; --btn-fg:#0E1422; --accent:#E9777C; --soft:#212C45;
  --good:#63CF92; --good-bg:#16301F; --bad:#F38B80; --bad-bg:#3A1C1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1422; --card:#172034; --ink:#E9EDF5; --muted:#A3AEC3; --line:#2B3650;
  --btn:#8FB2F2; --btn-fg:#0E1422; --accent:#E9777C; --soft:#212C45;
  --good:#63CF92; --good-bg:#16301F; --bad:#F38B80; --bad-bg:#3A1C1A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:20px;line-height:1.5;margin:0}
.wrap{max-width:560px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--f-head);text-wrap:balance;margin:0;line-height:1.25}
.bn{font-family:var(--f-bn)}
h1.bn{font-size:2rem;font-weight:700}
h2{font-size:1.3rem;font-weight:700}
.en-sub{font-size:.85rem;color:var(--muted);font-family:var(--f-body)}
.eyebrow{font-family:var(--f-bn);font-size:.9rem;color:var(--accent);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
button{font:inherit;cursor:pointer;border-radius:14px;border:0}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{background:var(--btn);color:var(--btn-fg);font-weight:700;font-size:1.2rem;padding:16px 20px;min-height:64px;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.25}
.btn .bn{font-size:1.3rem}
.btn .en{font-size:.85rem;font-weight:400;opacity:.85}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.yes{background:var(--good-bg);color:var(--good);border:2px solid var(--good)}
.btn.no{background:var(--bad-bg);color:var(--bad);border:2px solid var(--bad)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.link{background:none;color:var(--btn);text-decoration:underline;padding:10px 6px;font-size:1rem}
.tiles{display:flex;flex-direction:column;gap:14px}
.tile{display:flex;gap:16px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);color:var(--ink);padding:18px;min-height:96px}
.tile:hover{border-color:var(--btn)}
.tile .ic{flex:none;width:56px;height:56px;border-radius:14px;background:var(--soft);color:var(--btn);display:grid;place-items:center}
.tile .ic svg{width:30px;height:30px}
.tile.primary{background:var(--btn);border-color:var(--btn);color:var(--btn-fg)}
.tile.primary .ic{background:rgba(255,255,255,.18);color:var(--btn-fg)}
.tile b{font-family:var(--f-bn);font-size:1.45rem;display:block;line-height:1.2}
.tile span.m{font-family:var(--f-bn);font-size:1rem;opacity:.85;display:block}
.tile span.e{font-size:.8rem;opacity:.75;display:block}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 18px;font-size:.95rem}
summary{font-family:var(--f-head);font-weight:700;padding:12px 0;cursor:pointer}
details[open]{padding-bottom:18px}
.field{display:flex;flex-direction:column;gap:4px;margin-top:12px}
.field label{font-weight:700;font-size:.9rem}
input[type=text]{font:inherit;font-size:1rem;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
input[type=range]{width:100%;accent-color:var(--btn)}
.radio{display:flex;gap:10px;align-items:flex-start;margin-top:10px}
.radio input{width:22px;height:22px;margin-top:3px;accent-color:var(--btn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.topbar .count{font-family:var(--f-bn);font-size:1rem;text-align:right}
.pips{display:flex;gap:5px;flex-wrap:wrap}
.pip{width:14px;height:14px;border-radius:4px;background:var(--line)}
.pip.ok{background:var(--good)} .pip.no{background:var(--bad)} .pip.now{background:var(--btn)}
.qchip{font-family:var(--f-bn);font-size:.95rem;color:var(--muted)}
.qtext{font-family:var(--f-head);font-weight:800;font-size:1.55rem;line-height:1.3;text-wrap:balance}
.qbn{font-family:var(--f-bn);font-size:1.3rem;line-height:1.5;padding-top:12px;border-top:1px dashed var(--line)}
.qbn small{display:block;font-size:.85rem;color:var(--muted)}
.hearrow{display:flex;gap:10px;flex-wrap:wrap}
.hear{display:inline-flex;align-items:center;gap:8px;background:var(--soft);color:var(--ink);padding:12px 16px;font-weight:700;font-family:var(--f-bn);font-size:1.05rem;min-height:52px}
.hear svg{width:22px;height:22px;flex:none}
.mic{width:140px;height:140px;border-radius:50%;background:var(--btn);color:var(--btn-fg);display:grid;place-items:center;margin:4px auto 0;position:relative}
.mic svg{width:56px;height:56px}
.mic.on{background:var(--accent)}
.mic.on::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--accent);animation:pulse 1.4s ease-out infinite}
@keyframes pulse{from{opacity:.9;transform:scale(.95)}to{opacity:0;transform:scale(1.18)}}
@media (prefers-reduced-motion:reduce){.mic.on::before{animation:none}}
.miclabel{text-align:center;font-family:var(--f-bn);font-weight:700;font-size:1.2rem;line-height:1.3}
.miclabel span{display:block;font-family:var(--f-body);font-weight:400;font-size:.85rem;color:var(--muted)}
.heard{min-height:3em;background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:12px;font-size:1.15rem}
.heard i{color:var(--muted);font-family:var(--f-bn);font-style:normal}
.alts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.alt{background:var(--soft);color:var(--ink);padding:10px 6px;font-family:var(--f-bn);font-size:1rem;line-height:1.2;min-height:60px}
.alt span{display:block;font-family:var(--f-body);font-size:.75rem;color:var(--muted)}
.choice{background:var(--card);color:var(--ink);border:2px solid var(--line);text-align:left;padding:14px 16px;font-size:1.15rem;min-height:64px;width:100%;display:flex;flex-direction:column;gap:2px}
.choice:hover{border-color:var(--btn)}
.choice b{font-weight:700}
.choice span{font-family:var(--f-bn);font-size:1.05rem;color:var(--muted)}
.choices{display:flex;flex-direction:column;gap:10px}
.verdict{border-radius:14px;padding:16px;display:flex;gap:14px;align-items:center}
.verdict svg{flex:none;width:44px;height:44px}
.verdict b{font-family:var(--f-bn);font-size:1.8rem;display:block;line-height:1.1}
.verdict span{font-size:.95rem}
.verdict.ok{background:var(--good-bg);color:var(--good)}
.verdict.no{background:var(--bad-bg);color:var(--bad)}
.said{font-size:1.05rem}
.said .bn{color:var(--muted)}
.anslist{display:flex;flex-direction:column;gap:10px}
.ans{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--paper)}
.ans .t{flex:1;min-width:0}
.ans b{display:block;font-size:1.2rem}
.ans span{display:block;font-family:var(--f-bn);font-size:1.1rem;color:var(--muted)}
.ans .say{flex:none;width:48px;height:48px;background:var(--soft);color:var(--btn);display:grid;place-items:center}
.ans .say svg{width:22px;height:22px}
.label{font-family:var(--f-bn);font-weight:700;font-size:1.1rem}
.label span{font-family:var(--f-body);font-weight:400;font-size:.85rem;color:var(--muted)}
.override{align-self:center;font-family:var(--f-bn)}
.big{font-family:var(--f-head);font-weight:800;font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums}
.result-ok{color:var(--good)} .result-no{color:var(--bad)}
.missed{display:flex;flex-direction:column;gap:14px}
.missed .item{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.note{font-size:.9rem;color:var(--muted)}
.note.bn{font-size:1rem}
.star{color:var(--accent)}
a{color:var(--btn)}
</style>

const DEFAULTS = {testType:"standard", rate:0.85, president:"Donald Trump", vicepresident:"JD Vance", speaker:"Mike Johnson", chiefjustice:"John Roberts",

try{ const s = JSON.parse(localStorage.getItem("civics-coach-settings-ny")||"null"); if(s){ settings = {...DEFAULTS, ...s}; for(const k in DEFAULTS){ if(settings[k]==="" && DEFAULTS[k]) settings[k]=DEFAULTS[k]; } } }catch(e){}
function saveSettings(){ try{ localStorage.setItem("civics-coach-settings-ny", JSON.stringify(settings)); }catch(e){} }
// ---------- Matching what she says against the accepted answers ----------
const STOP = new Set("the a an of to and or in on for is are was were be it its they that this by with from their as at all because there have has do does did if so them s u".split(" "));
const WEAK = new Set("united states us america american americans branch government day".split(" "));
const ONES = {zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,
  first:1,second:2,third:3,fourth:4,fifth:5,sixth:6,seventh:7,eighth:8,ninth:9,tenth:10,eleventh:11,twelfth:12,thirteenth:13,fourteenth:14,fifteenth:15,sixteenth:16,seventeenth:17,eighteenth:18,nineteenth:19,twentieth:20,thirtieth:30};
const TENS = {twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};
function tokens(s){
  s = String(s).toLowerCase().replace(/[’'`]/g,"").replace(/&/g," and ").replace(/[^a-z0-9]+/g," ").replace(/\b(\d+)(st|nd|rd|th)\b/g,"$1");
  const t = s.split(" ").filter(Boolean), out=[]; let cur=null;
  const flush=()=>{ if(cur!==null){ out.push(String(cur)); cur=null; } };
  for(let i=0;i<t.length;i++){
    const w=t[i];
    if(w in TENS){ if(cur!==null && cur%100!==0) flush(); cur=(cur||0)+TENS[w]; }
    else if(w in ONES){ if(cur!==null && cur%10!==0) flush(); cur=(cur||0)+ONES[w]; }
    else if(w==="hundred" && cur!==null){ cur*=100; }
    else if(w==="thousand" && cur!==null){ cur*=1000; }
    else if(w==="and" && cur!==null && (t[i+1] in ONES || t[i+1] in TENS)){ }
    else { flush(); out.push(w); }
  }
  flush(); return out;
}
function lev(a,b){ const m=a.length,n=b.length; let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
function tokMatch(k,s){
  if(k===s) return true;
  if(/^\d+$/.test(k)||/^\d+$/.test(s)) return false;
  if(k.length>=4 && s.length>=4 && (k.startsWith(s)||s.startsWith(k))) return true;
  if(k.length>=5 && s.length>=4) return lev(k,s) <= (k.length>=8?2:1);
  return false;
}
function keywordsOf(text){
  const core = text.replace(/\[[^\]]*\]/g," ").replace(/\([^)]*\)/g," ");
  let t = tokens(core).filter(w=>!STOP.has(w));
  const strong = t.filter(w=>!WEAK.has(w));
  if(strong.length) return strong;
  if(t.length) return t;
  return tokens(text.replace(/[()]/g," ")).filter(w=>!STOP.has(w));
}
function scoreKw(kw, said){ const hit = kw.filter(k=>said.some(s=>tokMatch(k,s))).length; return kw.length ? hit/kw.length : 0; }
function needFor(k){ return k<=1?1 : k===2?2 : Math.ceil(k*0.6); }
// Returns how many distinct accepted answers she gave.
function countMatches(q, text){
  const said = tokens(text);
  const hit = new Set();
  q.groups.forEach(g=>{ if(g.forms.some(kw=>{ const need=needFor(kw.length); return kw.filter(k=>said.some(s=>tokMatch(k,s))).length>=need; })) hit.add(g.i); });
  return hit;
}


// ---------- Build the question list with today's settings ----------
function lastName(n){ const p=n.trim().split(/\s+/); return p.length>1?p[p.length-1]:null; }
function allQs(){
  const out=[];
  for(const [n,text,answers,alts] of QS){
    let ans=[], bnAns=[]; let dynamic=false;
    const bnList = BN[n] && BN[n][1];
    answers.forEach((a,i)=>{
      if(a.startsWith("$")){ dynamic=true; const v=(settings[a.slice(1)]||"").trim(); if(v){ ans.push(v); bnAns.push(null); } }
      else { ans.push(a); bnAns.push(bnList ? bnList[i] : null); }
    });
    if(dynamic && !ans.length) continue; // not filled in yet
    const groups = ans.map((a,i)=>({i, display:a, forms:[keywordsOf(a)]}));
    if(dynamic) groups.forEach(g=>{ const ln=lastName(g.display); if(ln) g.forms.push(keywordsOf(ln)); });
    (alts||[]).forEach(al=>{ const [t,idx] = Array.isArray(al)?al:[al,0]; if(groups[idx]) groups[idx].forms.push(keywordsOf(t)); });
    out.push({n,text,bn:BN[n]?BN[n][0]:"",answers:ans,bnAns,groups,need:NEED[n]||1,dynamic,star:STARRED.has(n)});
  }
  return out;
}
function missingStateFields(){ return ["senator1","representative","governor","capital"].filter(k=>!(settings[k]||"").trim()).length; }
const PART = n => n<=72 ? "gov" : n<=118 ? "hist" : "sym";

// ---------- Voice: read aloud ----------
let tts=null, ttsOff=false, dict=null, bnTtsOk=true;
const synth = window.speechSynthesis || null;
function clean(a){ return a.replace(/\[[^\]]*\]/g,"").replace(/[()“”]/g,"").replace(/\s+/g," ").trim(); }
function stopSpeaking(){ try{ tts && tts.stop(); }catch(e){} try{ synth && synth.cancel(); }catch(e){} }
function voiceFor(prefix){ try{ return (synth.getVoices()||[]).find(v=>v.lang && v.lang.toLowerCase().startsWith(prefix)); }catch(e){ return null; } }
function speak(text, lang){
  lang = lang || "en";
  stopSpeaking();
  if(tts && !ttsOff && (lang==="en" || bnTtsOk)){
    return tts.speak(text,{rate:Math.min(1.5,Math.max(0.7,settings.rate)), language:lang}).catch(e=>{
      if(e && e.code==="not_granted") ttsOff=true;
      else if(lang==="bn" && e && (e.code==="unavailable"||e.code==="upstream_error")){ bnTtsOk=false; render(); }
    });
  }
  if(ttsOff || !synth) return Promise.resolve();
  const v = voiceFor(lang==="bn"?"bn":"en-us") || (lang==="en"?voiceFor("en"):null);
  if(lang==="bn" && !v) return Promise.resolve();
  return new Promise(res=>{
    const u=new SpeechSynthesisUtterance(text); u.lang= lang==="bn" ? (v?v.lang:"bn-BD") : "en-US"; u.rate=settings.rate;
    if(v) u.voice=v; u.onend=res; u.onerror=res; synth.speak(u);
  });
}
function canSpeakBn(){ return (tts && !ttsOff && bnTtsOk) || (!tts && !!voiceFor("bn")); }

// ---------- Voice: hear her answer ----------
const NativeSR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let nativeBroken=false, rec=null;
const mic = {listening:false, finalText:"", partial:"", wantCheck:false};
function canListen(){ return !!dict || (!!NativeSR && !nativeBroken); }
function setupNative(){
  rec = new NativeSR(); rec.lang="en-US"; rec.interimResults=true; rec.continuous=true;
  rec.onresult = e=>{ let f="",p=""; for(const r of e.results){ if(r.isFinal) f+=r[0].transcript+" "; else p+=r[0].transcript; } mic.finalText=f; mic.partial=p; renderHeard(); };
  rec.onerror = e=>{ if(e.error==="not-allowed"||e.error==="service-not-allowed"){ nativeBroken=true; S.inputMode="choices"; S.choices=S.choices||makeChoices(cur()); S.notice="মাইক্রোফোন চালু নেই। নিচের উত্তরগুলো থেকে বেছে নিন।"; } };
  rec.onend = ()=>{ mic.listening=false; if(mic.wantCheck){ mic.wantCheck=false; submit(heardText()); } else render(); };
}
function heardText(){ return (mic.finalText+" "+mic.partial).trim(); }
function stopMicQuietly(){ if(mic.listening){ try{ dict?dict.stop():rec&&rec.stop(); }catch(e){} mic.listening=false; mic.wantCheck=false; } }
function startListening(){
  stopSpeaking();
  mic.finalText=""; mic.partial=""; mic.wantCheck=false;
  if(dict){
    mic.listening=true; render();
    dict.start({language:"en"}).catch(e=>{
      mic.listening=false;
      if(e && (e.code==="not_granted"||e.code==="unavailable")){ dict=null; if(!canListen()){ S.inputMode="choices"; S.choices=S.choices||makeChoices(cur()); S.notice="মাইক্রোফোন চালু নেই। নিচের উত্তরগুলো থেকে বেছে নিন।"; } }
      render();
    });
    return;
  }
  if(NativeSR){
    if(!rec) setupNative();
    try{ rec.start(); mic.listening=true; }catch(e){ nativeBroken=true; S.inputMode="choices"; S.choices=S.choices||makeChoices(cur()); }
    render();
  }
}
async function stopAndCheck(){
  if(dict){ try{ await dict.stop(); }catch(e){} mic.listening=false; submit(heardText()); return; }
  if(rec){ mic.wantCheck=true; try{ rec.stop(); }catch(e){ mic.wantCheck=false; submit(heardText()); } }
}

// ---------- Sessions ----------
let S = {screen:"home", inputMode:null, notice:""};
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function wake(){ try{ navigator.wakeLock && navigator.wakeLock.request("screen").catch(()=>{}); }catch(e){} }
function testSpec(){ return settings.testType==="senior" ? {total:10, pass:6, label:"৬৫/২০ পরীক্ষা"} : {total:20, pass:12, label:"আসল পরীক্ষা"}; }
function startQuiz(onlyNums){
  const spec = testSpec();
  let pool = allQs();
  if(settings.testType==="senior" && !onlyNums) pool = pool.filter(q=>q.star);
  if(onlyNums) pool = pool.filter(q=>onlyNums.includes(q.n));
  const queue = shuffle(pool).slice(0, onlyNums ? pool.length : spec.total);
  if(!queue.length) return;
  S = {screen:"quiz", practice:!!onlyNums, spec, queue, idx:0, results:[], phase:"ask",
       inputMode: canListen() ? "voice" : "choices", notice:"", choices:null, typed:""};
  wake(); askCurrent();
}
function startLearn(){
  let pool = allQs(); if(settings.testType==="senior") pool = pool.filter(q=>q.star);
  S = {screen:"learn", queue:shuffle(pool), idx:0, revealed:false, knew:0};
  wake(); render(); speak(cur().text);
}
function cur(){ return S.queue[S.idx]; }
function askCurrent(){
  S.phase="ask"; S.choices=null; S.typed=""; S.notice=""; mic.finalText=""; mic.partial="";
  if(S.inputMode==="choices") S.choices=makeChoices(cur());
  render();
  speak("Question " + (S.idx+1) + ". " + cur().text);
}
function makeChoices(q){
  const ri = Math.floor(Math.random()*q.answers.length);
  const right = {en:clean(q.answers[ri]), bn:q.bnAns[ri]?clean(q.bnAns[ri]):""};
  let pool;
  if(q.dynamic){
    const names=[settings.president,settings.vicepresident,settings.speaker,settings.chiefjustice,"George Washington","Abraham Lincoln","Thomas Jefferson","Benjamin Franklin"];
    pool = (q.n===62 ? ["Albany","Sacramento","Austin","Tallahassee","Springfield","Columbus","Denver","Atlanta"] : names).filter(Boolean).map(en=>({en,bn:""}));
  } else {
    pool = allQs().filter(o=>!o.dynamic && o.n!==q.n && PART(o.n)===PART(q.n)).flatMap(o=>o.answers.map((a,i)=>({en:clean(a), bn:o.bnAns[i]?clean(o.bnAns[i]):""})));
  }
  const picks=[]; const seen=new Set([right.en.toLowerCase()]);
  for(const c of shuffle(pool)){
    if(picks.length>=3) break;
    if(!c.en || seen.has(c.en.toLowerCase())) continue;
    if(countMatches(q,c.en).size) continue;
    seen.add(c.en.toLowerCase()); picks.push(c);
  }
  return shuffle([right,...picks]);
}
function submit(text){
  const q=cur(); text=(text||"").trim();
  const hits = text ? countMatches(q,text) : new Set();
  const ok = hits.size >= q.need;
  S.results.push({q, said:text, ok, got:hits.size});
  markMissed(q.n, !ok);
  S.phase="feedback"; render();
  const examples = q.answers.slice(0, q.need).map(clean);
  if(ok) speak("Correct!");
  else if(hits.size>0 && q.need>1) speak(`You need ${q.need} answers. For example: ${examples.join(", and ")}.`);
  else speak((q.need>1 ? `Correct answers: ${examples.join(", and ")}.` : `The answer is: ${examples[0]}.`));
}
function override(){ const r=S.results[S.results.length-1]; r.ok=!r.ok; r.overridden=true; markMissed(r.q.n, !r.ok); render(); }
function tally(){ const ok=S.results.filter(r=>r.ok).length; return {ok, no:S.results.length-ok}; }
function isDone(){ const {ok,no}=tally(), total=S.queue.length, graded=!S.practice; return S.idx+1>=total || (graded && (ok>=S.spec.pass || no > total-S.spec.pass)); }
function next(){
  if(isDone()){ S.screen="result"; render(); const {ok}=tally(); const passed=!S.practice && ok>=S.spec.pass;
    speak(S.practice ? `All done. ${ok} right out of ${S.results.length}.` : passed ? `You passed! ${ok} right out of ${S.results.length}.` : `Not yet. ${ok} right out of ${S.results.length}. Keep practicing.`);
    return; }
  S.idx++; askCurrent();
}
function setInput(m){ stopMicQuietly(); S.inputMode=m; S.notice=""; if(m==="choices" && !S.choices) S.choices=makeChoices(cur()); render();

    <summary>Family settings (English)</summary>
    <div class="field"><label>Which test</label></div>
    <label class="radio"><input type="radio" name="tt" value="standard" ${settings.testType!=="senior"?"checked":""}><span><b>Standard 2025 test</b><br><span class="note">20 random questions, pass with 12.</span></span></label>
    <label class="radio"><input type="radio" name="tt" value="senior" ${settings.testType==="senior"?"checked":""}><span><b>65/20 test</b><br><span class="note">Only for age 65+ with 20+ years as a green card holder. 10 of the 20 starred questions, pass with 6.</span></span></label>
    <h2 style="margin-top:18px;font-size:1rem">Her state (New York)</h2>
    <div class="grid2">${field("senator1","Senator 1")}${field("senator2","Senator 2")}</div>
    ${field("representative","U.S. representative (ZIP 11208)","Look up with her ZIP at house.gov")}
    <div class="grid2">${field("governor","Governor")}${field("capital","State capital")}</div>
    <h2 style="margin-top:18px;font-size:1rem">Current officials</h2>
    <p class="note" style="margin:4px 0 0">These change with elections. Check them at <a href="https://www.uscis.gov/citizenship/testupdates" target="_blank" rel="noopener">uscis.gov/citizenship/testupdates</a> before her interview.</p>
    <div class="grid2">${field("president","President")}${field("vicepresident","Vice President")}</div>
    <div class="grid2">${field("speaker","Speaker of the House")}${field("chiefjustice","Chief Justice")}</div>
    <div class="field"><label for="rate">Reading speed: <span id="rateval">${settings.rate.toFixed(2)}×</span></label>
    <input type="range" id="rate" min="0.7" max="1.3" step="0.05" value="${settings.rate}"></div>
    <div class="row" style="margin-top:12px"><button class="btn ghost" id="testvoice"><span class="en" style="font-size:1rem;opacity:1">Try the voice</span></button>${nMissed?`<button class="btn ghost" id="clearmissed"><span class="en" style="font-size:1rem;opacity:1">Clear mistakes list</span></button>`:""}</div>
  </details>
  <p class="note" style="margin:0">Questions and answers are from the official USCIS list (form M-1778, 2025 version).</p>`;
  const $=id=>document.getElementById(id);
  $("learn").onclick=startLearn;
  $("go").onclick=()=>startQuiz();
  $("redo") && ($("redo").onclick=()=>startQuiz([...missedSet]));
  app.querySelectorAll('input[name="tt"]').forEach(r=>r.onchange=()=>{ settings.testType=r.value; saveSettings(); keepOpen(renderHome); });
  app.querySelectorAll("[data-set]").forEach(i=>{ i.oninput=()=>{ settings[i.dataset.set]=i.value; saveSettings(); }; i.onchange=()=>keepOpen(renderHome); });
  const r=$("rate"); r.oninput=()=>{ settings.rate=parseFloat(r.value); $("rateval").textContent=settings.rate.toFixed(2)+"×"; saveSettings(); };
  $("testvoice").onclick=()=>speak("What is the supreme law of the land?");
  $("clearmissed") && ($("clearmissed").onclick=()=>{ missedSet.forEach(n=>markMissed(n,false)); keepOpen(renderHome); });
}
function keepOpen(fn){ const open=[...app.querySelectorAll("details")].map(d=>d.open); fn(); app.querySelectorAll("details").forEach((d,k)=>d.open=!!open[k]); }
function questionCard(q, numLabel){
  return `<section class="card">
      <div class="qchip">${numLabel} · প্রশ্ন নং ${bnNum(q.n)}${q.star?' <span class="star" title="65/20">★</span>':""}</div>
      <div class="qtext" lang="en">${esc(q.text)}</div>
      ${q.bn?`<div class="qbn" lang="bn"><small>বাংলা অর্থ</small>${esc(q.bn)}</div>`:""}
      <div class="hearrow">
        <button class="hear" id="hear">${ICON.speaker} আবার শুনুন</button>
        ${q.bn && canSpeakBn()?`<button class="hear" id="hearbn">${ICON.speaker} বাংলায় শুনুন</button>`:""}
      </div>
    </section>`;
}
function bindQuestionCard(q){
  document.getElementById("hear").onclick=()=>speak(q.text);
  const b=document.getElementById("hearbn"); if(b) b.onclick=()=>speak(q.bn,"bn");
}
function answerRows(q, limit){
  const idx = q.answers.map((_,i)=>i).slice(0, limit);
  return `<div class="anslist">${idx.map(i=>`<div class="ans"><div class="t"><b lang="en">${esc(clean(q.answers[i]))}</b>${q.bnAns[i]?`<span lang="bn">${esc(q.bnAns[i])}</span>`:""}</div><button class="say" data-say="${i}" aria-label="Hear this answer">${ICON.speaker}</button></div>`).join("")}</div>`;
}
function bindAnswerRows(q){ app.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(clean(q.answers[+b.dataset.say]))); }
function howMany(q){ return q.need>1 ? `যেকোনো ${bnNum(q.need)}টি বলতে হবে <span>Name any ${q.need}</span>` : q.answers.length>1 ? `যেকোনো একটি বললেই হবে <span>Any one is correct</span>` : `উত্তর <span>Answer</span>`; }
function renderLearn(){
  const q=cur(), total=S.queue.length;
  const limit = q.answers.length<=4 ? 4 : 3;
  app.innerHTML = `
    <div class="topbar"><button class="link" id="quit" style="padding-left:0">← বন্ধ করুন</button><span class="count">শিখুন · ${bnNum(S.idx+1)} / ${bnNum(total)}</span></div>
    ${questionCard(q,"শিখুন")}
    ${!S.revealed ? `<button class="btn" id="reveal"><span class="bn">উত্তর দেখুন</span><span class="en">Show the answer</span></button>` : `
    <section class="card">
      <div class="label">${howMany(q)}</div>
      ${answerRows(q, limit)}
      ${q.answers.length>limit?`<div class="note">+ ${q.answers.length-limit} more correct answers</div>`:""}
    </section>
    <div class="row">
      <button class="btn yes" id="knew"><span class="bn">পেরেছি</span><span class="en">I knew it</span></button>
      <button class="btn no" id="didnt"><span class="bn">পারিনি</span><span class="en">I didn't know</span></button>
    </div>`}`;
  const $=id=>document.getElementById(id);
  $("quit").onclick=goHome;
  bindQuestionCard(q);
  $("reveal") && ($("reveal").onclick=()=>{ S.revealed=true; render(); speak("Answer: " + q.answers.slice(0, Math.max(1,q.need)).map(clean).join(", and ")); });
  bindAnswerRows(q);
  const go=(knew)=>{ markMissed(q.n,!knew); if(S.idx+1>=total){ goHome(); return; } S.idx++; S.revealed=false; render(); speak(cur().text); };
  $("knew") && ($("knew").onclick=()=>go(true));
  $("didnt") && ($("didnt").onclick=()=>go(false));
}
function renderQuiz(){
  const q=cur(), {ok,no}=tally(), total=S.queue.length;
  const pips = total<=20 ? `<div class="pips" aria-hidden="true">${S.queue.map((_,i)=>{ const r=S.results[i]; return `<span class="pip ${r?(r.ok?"ok":"no"):(i===S.idx?"now":"")}"></span>`; }).join("")}</div>` : "";
  let body="";
  if(S.phase==="ask"){
    if(S.inputMode==="voice"){
      body = `
        <button class="mic ${mic.listening?"on":""}" id="micbtn" aria-label="${mic.listening?"Done answering":"Tap and answer out loud"}">${mic.listening?ICON.stop:ICON.mic}</button>
        <div class="miclabel">${mic.listening?`শুনছি… বলা শেষ হলে চাপুন<span>Listening — tap when done</span>`:`চাপুন, তারপর ইংরেজিতে উত্তর বলুন<span>Tap, then say the answer in English</span>`}</div>
        <div class="heard" id="heard" aria-live="polite">${heardHTML()}</div>`;
    } else if(S.inputMode==="type"){
      body = `<form id="typeform" class="row" style="align-items:stretch"><input type="text" id="typed" placeholder="Type the answer" autocomplete="off" value="${esc(S.typed)}" style="flex:2 1 200px"><button class="btn" type="submit" style="flex:1 1 100px;min-height:52px"><span class="bn" style="font-size:1.1rem">দেখুন</span></button></form>`;
    } else {
      body = `<div class="label">সঠিক উত্তরটি বেছে নিন <span>Pick the correct answer</span></div>
        <div class="choices">${S.choices.map((c,i)=>`<button class="choice" data-choice="${i}"><b lang="en">${esc(c.en)}</b>${c.bn?`<span lang="bn">${esc(c.bn)}</span>`:""}</button>`).join("")}</div>
        <button class="hear" id="hearchoices">${ICON.speaker} উত্তরগুলো শুনুন</button>`;
    }
    const opts = [];
    if(S.inputMode!=="voice" && canListen()) opts.push(`<button class="alt" data-input="voice">মুখে বলুন<span>Speak</span></button>`);
    if(S.inputMode!=="choices") opts.push(`<button class="alt" data-input="choices">বেছে নিন<span>Choices</span></button>`);
    if(S.inputMode!=="type") opts.push(`<button class="alt" data-input="type">লিখুন<span>Type</span></button>`);
    opts.push(`<button class="alt" id="idk">জানি না<span>I don't know</span></button>`);
    body += `<div class="alts">${opts.join("")}</div>`;
    if(S.notice) body = `<p class="note bn" style="margin:0">${esc(S.notice)}</p>` + body;
  } else {
    const r=S.results[S.results.length-1];
    const limit = q.answers.length<=4 ? 4 : 3;
    body = `
      <div class="verdict ${r.ok?"ok":"no"}" role="status">${r.ok?ICON.ok:ICON.no}<div><b>${r.ok?"সঠিক!":(r.got>0&&q.need>1?`${bnNum(r.got)}টি হয়েছে, ${bnNum(q.need)}টি লাগবে`:"হয়নি")}</b><span>${r.ok?"Correct":"Not quite"}${r.overridden?" · changed by hand":""}</span></div></div>
      <div class="said"><span class="bn">আপনি বলেছেন:</span> ${r.said?`“${esc(r.said)}”`:`<span class="bn muted">কোনো উত্তর নেই</span>`}</div>
      <div class="label">${howMany(q)}</div>
      ${answerRows(q, limit)}
      <button class="btn" id="next"><span class="bn">${isDone()?"ফলাফল দেখুন":"পরের প্রশ্ন →"}</span><span class="en">${isDone()?"See results":"Next question"}</span></button>
      <button class="link override" id="override">${r.ok?"আসলে ভুল ছিল (count as wrong)":"উত্তরটা ঠিক ছিল (count as right)"}</button>`;
  }
  app.innerHTML = `
    <div class="topbar">
      <button class="link" id="quit" style="padding-left:0">← বন্ধ করুন</button>
      <span class="count">${bnNum(S.idx+1)} / ${bnNum(total)} · <span style="color:var(--good)">${bnNum(ok)} ঠিক</span> · <span style="color:var(--bad)">${bnNum(no)} ভুল</span></span>
    </div>
    ${pips}
    ${questionCard(q, S.practice?"অনুশীলন":"পরীক্ষা")}
    <section class="card">${body}</section>`;
  const $=id=>document.getElementById(id);
  $("quit").onclick=goHome;
  bindQuestionCard(q);
  $("micbtn") && ($("micbtn").onclick=()=> mic.listening ? stopAndCheck() : startListening());
  $("typeform") && ($("typeform").onsubmit=e=>{ e.preventDefault(); submit($("typed").value); });
  $("typed") && ($("typed").oninput=e=>S.typed=e.target.value);
  app.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>submit(S.choices[+b.dataset.choice].en));
  $("hearchoices") && ($("hearchoices").onclick=()=>speak(S.choices.map((c,i)=>`${["A","B","C","D"][i]}. ${c.en}.`).join(" ")));
  app.querySelectorAll("[data-input]").forEach(b=>b.onclick=()=>setInput(b.dataset.input));
  $("idk") && ($("idk").onclick=()=>{ stopMicQuietly(); submit(""); });
  $("next") && ($("next").onclick=next);
  $("override") && ($("override").onclick=override);
  bindAnswerRows(q);
}
function heardHTML(){ const t=heardText(); return t?esc(t):`<i>আপনার উত্তর এখানে দেখা যাবে</i>`; }
function renderHeard(){ const h=document.getElementById("heard"); if(h) h.innerHTML=heardHTML(); }
function renderResult(){
  const {ok}=tally(), n=S.results.length, graded=!S.practice, passed=graded&&ok>=S.spec.pass;
  const missed=S.results.filter(r=>!r.ok);
  app.innerHTML = `
    <section class="card" style="text-align:center;align-items:center">
      <div class="eyebrow">${S.practice?"অনুশীলন":S.spec.label}</div>
      <div class="big ${graded?(passed?"result-ok":"result-no"):""}">${bnNum(ok)} / ${bnNum(n)}</div>
      <h2 class="bn">${graded?(passed?"পাস করেছেন! অভিনন্দন!":"এবার হয়নি। আরও অনুশীলন করুন।"):"শেষ হয়েছে"}</h2>
      <div class="en-sub">${graded?(passed?"Passed!":"Not yet — keep practicing"):"Round finished"}</div>
      ${graded?`<p class="note bn" style="margin:0">${passed?`${bnNum(S.spec.pass)}টি ঠিক হলেই অফিসার পরীক্ষা থামিয়ে দেন।`:`পাস করতে ${bnNum(S.spec.pass)}টি ঠিক উত্তর লাগে।`}</p>`:""}
    </section>
    ${missed.length?`<section class="card"><h2 class="bn">যেগুলো আবার দেখবেন</h2><div class="missed">${missed.map(r=>`<div class="item"><b lang="en">${esc(r.q.text)}</b>${r.q.bn?`<span class="bn muted">${esc(r.q.bn)}</span>`:""}<div><span class="bn">উত্তর:</span> <b lang="en">${r.q.answers.slice(0,Math.max(2,r.q.need)).map(a=>esc(clean(a))).join(" · ")}</b></div></div>`).join("")}</div></section>`:""}
    <div class="row">
      ${missed.length?`<button class="btn" id="redo"><span class="bn">এই ${bnNum(missed.length)}টি আবার</span><span class="en">Practice these again</span></button>`:""}
      <button class="btn ${missed.length?"ghost":""}" id="again"><span class="bn">নতুন পরীক্ষা</span><span class="en">New test</span></button>
    </div>
    <button class="link bn" id="home" style="align-self:center">← শুরুতে ফিরুন</button>`;
  const nums=missed.map(r=>r.q.n);
  document.getElementById("redo") && (document.getElementById("redo").onclick=()=>startQuiz(nums));
  document.getElementById("again").onclick=()=>startQuiz();
  document.getElementById("home").onclick=goHome;
}

// ---------- Connect to the viewer's voice features when available ----------
if(window.claude && window.claude.use){
  window.claude.use("tts").then(t=>{ if(t){ tts=t; render(); } }).catch(()=>{});
  window.claude.use("dictation").then(d=>{
    if(!d) return; dict=d;
    d.onPartial(({text})=>{ mic.partial=text; renderHeard(); });
    d.onFinal(({text})=>{ mic.finalText=(mic.finalText+" "+text).trim(); mic.partial=""; renderHeard(); });
    d.onState(({state,reason})=>{
      if(state==="idle" && mic.listening){ mic.listening=false;
        if(reason==="viewer_stopped" && S.screen==="quiz" && S.phase==="ask" && heardText()) submit(heardText()); else render(); }
    });
  }).catch(()=>{});
}
if(synth){ try{ synth.getVoices(); synth.addEventListener && synth.addEventListener("voiceschanged",()=>{ if(S.screen!=="home") render(); }); }catch(e){} }
render();
</script>

</body>
</html>
